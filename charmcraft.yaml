type: charm
# Multi-base build. The charm is built for and runs on each of the platforms
# below. Building for ubuntu@26.04 with the 'charm' plugin currently requires
# CHARMCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS=true (set by the CI workflows).
platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:
parts:
  charm:
    override-build: |
      rustup default stable
      craftctl default
    build-snaps:
      - rustup
    build-packages:
      - libffi-dev
      - libssl-dev
      - pkg-config
